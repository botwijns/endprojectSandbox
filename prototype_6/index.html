<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Melodie-spel prototype 6</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #ffffff; color: #111;
      font-family: system-ui, sans-serif; overflow: hidden;
      touch-action: none; user-select: none;
    }
    .hidden { display: none !important; }

    /* ── Start screen ──────────────────────────────────────────────────── */
    #start-screen {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.9rem; padding: 1.5rem; box-sizing: border-box; text-align: center;
      max-width: 32rem; margin: 0 auto;
    }
    #start-screen h1 { font-size: clamp(1.2rem, 6vmin, 1.8rem); margin: 0; }
    #start-screen p { font-size: clamp(0.85rem, 4vmin, 1.05rem); line-height: 1.5; margin: 0; }
    #start-options {
      display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start;
      font-size: 0.9rem; text-align: left;
    }
    #start-options label { display: block; margin: 0.15rem 0; }
    #start-note { font-weight: 700; }
    #menu-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    #start-screen button {
      font-size: 1rem; padding: 0.6rem 1.1rem; cursor: pointer;
      border-radius: 8px; border: 1px solid rgb(0 0 0 / 0.3); background: #f4f4f4;
    }

    /* ── Game screen ───────────────────────────────────────────────────── */
    #game-screen { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 52px 6px 10px; box-sizing: border-box;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 13px;
      pointer-events: none;
    }
    .zone {
      position: fixed; z-index: 5;
      border: 2px dashed rgb(0 0 0 / 0.22); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 12px; line-height: 1.25;
      padding: 6px; box-sizing: border-box; color: rgb(0 0 0 / 0.45);
      pointer-events: none;
    }
    #zone-strip {
      position: fixed; z-index: 5;
      bottom: 0; left: 0; width: 100%; height: 14%;
      border: none; padding: 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
    }
    #zone-strip > div {
      border: 2px dashed rgb(0 0 0 / 0.22); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 12px; color: rgb(0 0 0 / 0.45);
      padding: 4px; pointer-events: none;
    }
    #grid {
      position: fixed; left: 0; top: 0; width: 100%; height: 86%; z-index: 4;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 2px; padding: 2px; box-sizing: border-box;
    }
    .cell { background: rgb(0 0 0 / 0.06); border-radius: 4px; }
    .cell.current { outline: 2px solid rgb(0 0 0 / 0.65); outline-offset: -2px; }
    #log {
      position: fixed; bottom: 15%; left: 8px; z-index: 10;
      font-size: 13px; opacity: 0.85;
    }
    /* Excluded from the pad zone via InputHandler's ctrlStop rectangle (see
       zoneFor in inputHandler.ts) so its native click isn't stolen by the
       pad's setPointerCapture(). */
    #stop-btn {
      position: fixed; z-index: 11; top: 4px; left: 50%; transform: translateX(-50%);
      font-size: 12px; padding: 4px 10px; cursor: pointer;
      border-radius: 6px; border: 1px solid rgb(0 0 0 / 0.3); background: rgba(255,255,255,0.85);
    }

    /* ── Tutorial card (oefenlevel only) ─────────────────────────────────── */
    /* The card lets taps fall through to the pad; only the Volgende button
       (data-ui, see inputHandler.ts) takes its own clicks. */
    #tutorial {
      position: fixed; z-index: 10; top: 34px; left: 50%; transform: translateX(-50%);
      width: min(92vw, 26rem); box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 10px 14px 12px; text-align: center;
      background: rgba(255,255,255,0.8); border: 1px solid rgb(0 0 0 / 0.18);
      border-radius: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
      pointer-events: none;
    }
    #tut-progress { font-size: 12px; color: rgb(0 0 0 / 0.55); font-weight: 600; }
    #tut-text { margin: 0; font-size: clamp(0.9rem, 4vmin, 1.05rem); line-height: 1.4; }
    #tut-visual:empty { display: none; }
    #tut-visual svg { width: 72px; height: 72px; display: block; }
    #tut-next {
      pointer-events: auto; font-size: 1rem; padding: 0.5rem 1.4rem; cursor: pointer;
      border-radius: 8px; border: 1px solid rgb(0 0 0 / 0.3); background: #4cafef; color: #fff;
      font-weight: 600;
    }
    #tut-next:disabled { background: #e2e2e2; color: rgb(0 0 0 / 0.4); cursor: default; }

    .track-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 100%; }
    .track-row .tile {
      height: 28px; border-radius: 5px; background: rgb(0 0 0 / 0.08);
      transition: background 60ms, transform 60ms;
    }
    .track-row .tile.on { background: #4cafef; transform: scale(1.08); }

    /* Vertical hoog/laag key along the right edge, spanning the pad area
       (0–86% of the height, matching STRIP_Y in inputHandler.ts). */
    #pitch-guide {
      position: fixed; z-index: 9; right: 4px; top: 52px; height: calc(85% - 52px); width: 34px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; color: #1b6fa8; pointer-events: none;
    }
    #pitch-guide .shaft {
      flex: 1; width: 4px; border-radius: 2px;
      background: linear-gradient(#1b6fa8, rgb(76 175 239 / 0.25));
    }

    #zone-strip > div.zone-highlight {
      border: 3px solid #4cafef; color: #1b6fa8; font-weight: 700;
      animation: zone-pulse 1s ease-in-out infinite;
    }
    @keyframes zone-pulse {
      0%, 100% { background: rgb(76 175 239 / 0.08); }
      50%      { background: rgb(76 175 239 / 0.35); }
    }

    .tut-notes .note { animation: note-float 1.6s ease-in-out infinite; }
    .tut-notes .note:nth-child(2) { animation-delay: 0.3s; }
    .tut-notes .note:nth-child(3) { animation-delay: 0.6s; }
    @keyframes note-float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .tut-tap .ripple { transform-origin: 50px 30px; animation: tap-ripple 1.2s ease-out infinite; }
    @keyframes tap-ripple {
      0%   { transform: scale(0.4); opacity: 0.9; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .tut-shake .phone { transform-origin: 50px 50px; animation: phone-shake 0.9s ease-in-out infinite; }
    @keyframes phone-shake {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); }
      60% { transform: rotate(-10deg); } 80% { transform: rotate(6deg); }
    }

    /* ── Phones in landscape ───────────────────────────────────────────── */
    /* Very little height: tighten spacing so the text fits, and let the start
       screen scroll as a last resort rather than clipping it. */
    @media (orientation: landscape) and (max-height: 500px) {
      #start-screen {
        justify-content: safe center; gap: 0.5rem; padding: 0.75rem 1rem;
        max-width: 40rem; overflow-y: auto; touch-action: pan-y;
      }
      #start-screen p { line-height: 1.35; }
      #start-options { gap: 0.2rem; }
      #tutorial { gap: 4px; padding: 6px 12px 8px; }
      #tut-visual svg { width: 44px; height: 44px; }
      #tut-text { line-height: 1.3; }
      #tut-next { padding: 0.35rem 1.2rem; }
    }
  </style>
</head>
<body>

<div id="start-screen">
  <h1>Prototype 6 &mdash; Maak een sfeer</h1>
  <p id="intro-blurb">
    Maak op je gehoor een muziekje bij een opdracht (bijvoorbeeld &ldquo;iets vrolijks&rdquo;).
    In het <strong>oefenlevel</strong> leer je stap voor stap de bediening kennen.
  </p>
  <div id="start-options">
    <label><input type="checkbox" id="speech-toggle" checked> Spraak (voice-over)</label>
    <label><input type="checkbox" id="random-note-toggle"> Willekeurige toonhoogte bij plaatsen</label>
  </div>
  <p id="start-note" class="hidden"></p>
  <div id="menu-buttons">
    <button id="intro-btn">Start oefenlevel</button>
    <button id="game-btn">Start spel</button>
  </div>
</div>

<div id="game-screen" class="hidden">
  <div id="hud">
    <span id="hud-phase"></span>
    <span id="hud-bpm"></span>
    <span id="hud-instrument"></span>
    <span id="hud-backing"></span>
  </div>

  <div id="grid"></div>
  <div id="zone-strip">
    <div>wis noot<br>laatst geplaatst</div>
    <div>instrument<br>wisselen</div>
  </div>
  <div id="log"></div>
  <button id="stop-btn">Stop</button>

  <div id="tutorial" class="hidden">
    <div id="tut-progress"></div>
    <div id="tut-visual" aria-hidden="true"></div>
    <p id="tut-text"></p>
    <button id="tut-next" data-ui>Volgende</button>
  </div>
  <div id="pitch-guide" class="hidden" aria-hidden="true">
    <span>hoog</span><div class="shaft"></div><span>laag</span>
  </div>
</div>

<!-- WebAudioFont instrument banks live in the shared repo-root /public/fonts
     folder (wired up via `publicDir` in vite.prototype_6.config.ts). Paths are
     relative so they resolve under the deployed sub-path for both dev and Pages. -->
<script src="fonts/0000_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0040_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0301_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0331_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0361_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0421_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0430_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0560_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0882_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/1140_Chaos_sf2_file.js"></script>
<script src="fonts/12836_1_Chaos_sf2_file.js"></script>
<script src="fonts/12838_1_Chaos_sf2_file.js"></script>
<script src="fonts/12842_1_Chaos_sf2_file.js"></script>

<script type="module" src="src/main.ts"></script>
</body>
</html>
