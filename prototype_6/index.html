<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Melodie-spel prototype 6</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #ffffff; color: #111;
      font-family: system-ui, sans-serif; overflow: hidden;
      touch-action: none; user-select: none;
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 10px; box-sizing: border-box;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 13px;
      pointer-events: none;
    }
    .zone {
      position: fixed; z-index: 5;
      border: 2px dashed rgb(0 0 0 / 0.22); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 12px; line-height: 1.25;
      padding: 6px; box-sizing: border-box; color: rgb(0 0 0 / 0.45);
      pointer-events: none;
    }
    #zone-topright { top: 0; right: 0; width: 40%; height: 22%; }
    #zone-strip {
      bottom: 0; left: 0; width: 100%; height: 14%;
      border: none; padding: 0;
      display: grid; grid-template-columns: 34fr 33fr 33fr; gap: 3px;
    }
    #zone-strip > div {
      border: 2px dashed rgb(0 0 0 / 0.22); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 12px; color: rgb(0 0 0 / 0.45);
      padding: 4px;
    }
    #grid {
      position: fixed; left: 0; top: 0; width: 50%; height: 86%; z-index: 4;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 2px; padding: 2px; box-sizing: border-box;
    }
    .cell { background: rgb(0 0 0 / 0.06); border-radius: 4px; }
    .cell.current { outline: 2px solid rgb(0 0 0 / 0.65); outline-offset: -2px; }
    .cell.cursor  { outline: 2px solid #d62828; outline-offset: -2px; }
    #log {
      position: fixed; bottom: 15%; left: 8px; z-index: 10;
      font-size: 13px; opacity: 0.85;
    }
  </style>
</head>
<body>
<div id="hud">
  <span id="hud-phase"></span>
  <span id="hud-bpm"></span>
  <span id="hud-instrument"></span>
  <span id="hud-backing"></span>
  <span id="hud-mode"></span>
</div>

<div id="zone-topright" class="zone">3× tikken = start<br>tijdens spel: 1× = opdracht herhalen · 3× = klaar</div>
<div id="grid"></div>
<div id="zone-strip">
  <div>wis noot<br>op deze stap</div>
  <div>instrument<br>wisselen</div>
  <div>modus<br>componeren / bewerken</div>
</div>
<div id="log"></div>
<!-- WebAudioFont instrument banks live in the shared repo-root /public/fonts
     folder (wired up via `publicDir` in vite.prototype_6.config.ts). Paths are
     relative so they resolve under the deployed sub-path for both dev and Pages. -->
<script src="fonts/0000_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0241_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/0321_GeneralUserGS_sf2_file.js"></script>
<script src="fonts/12836_1_Chaos_sf2_file.js"></script>
<script src="fonts/12838_1_Chaos_sf2_file.js"></script>
<script src="fonts/12842_1_Chaos_sf2_file.js"></script>

<script type="module" src="src/main.ts"></script>
</body>
</html>
