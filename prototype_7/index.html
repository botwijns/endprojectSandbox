<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Wat hoor je? — muziekquiz (prototype 7)</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #ffffff; color: #111;
      font-family: system-ui, sans-serif; overflow: hidden;
      touch-action: none; user-select: none;
    }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 6px 52px 6px 10px; box-sizing: border-box;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 13px;
      pointer-events: none;
    }
    #hud select {
      pointer-events: auto; font-size: 13px;
    }
    /* Dashed guides mirror the hit zones in src/inputHandler.ts. Sighted aid only.
       Default layout is 4 corners (50%/50% quadrants); body.answers-2 switches
       to a left/right split for 2-option questions, matching zonesFor() in
       src/inputHandler.ts. Repeating the question/song is done by shaking the
       phone, not a tap zone - see InputHandler.enableMotion(). */
    .zone {
      position: fixed; z-index: 5;
      border: 2px dashed rgb(0 0 0 / 0.20); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 13px; line-height: 1.3;
      padding: 8px; box-sizing: border-box; color: rgb(0 0 0 / 0.45);
      pointer-events: none;
    }
    /* 4-answer layout (default): quadrants split at x 50%, y 50% */
    #zone-a { left: 0;   top: 0;    width: 50%; height: 50%; }
    #zone-b { right: 0;  top: 0;    width: 50%; height: 50%; }
    #zone-c { left: 0;   bottom: 0; width: 50%; height: 50%; }
    #zone-d { right: 0;  bottom: 0; width: 50%; height: 50%; }
    /* 2-answer layout: left/right halves, C/D unused */
    body.answers-2 #zone-a { height: 100%; }
    body.answers-2 #zone-b { height: 100%; }
    body.answers-2 #zone-c, body.answers-2 #zone-d { display: none; }
    /* no answer can be given on the start screen, nor while the intro host explains */
    body.no-zones .zone { display: none; }

    /* ── Start screen / game screen (ported from prototype 5's style.css) ── */
    #start-screen, #game-screen {
      position: fixed; inset: 0; z-index: 6;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 3rem 1rem 1rem; box-sizing: border-box; text-align: center;
    }
    #start-screen { background: #ffffff; }
    #start-screen[hidden], #game-screen[hidden], #start-note[hidden] { display: none; }
    h1 { font-size: clamp(1.2rem, 6vmin, 2.5rem); margin: 0 0 0.5rem; }
    #intro-blurb {
      line-height: 1.7; font-size: clamp(0.8rem, 4vmin, 1.3rem); max-width: 40rem; margin: 0.5rem 0;
    }
    #start-note { font-weight: 700; font-size: clamp(0.9rem, 4vmin, 1.3rem); margin: 0.5rem 0; }
    #menu-buttons {
      display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 0.5rem;
    }
    button, .home-link {
      font: inherit; font-size: clamp(0.9rem, 4vmin, 1.25rem);
      padding: 0.6rem 1.2rem; cursor: pointer;
    }
    .home-link {
      display: inline-block; margin-top: 1.25rem; color: #111; text-decoration: none;
      border: 2px solid rgb(0 0 0 / 0.35); border-radius: 6px; background: #f2f2f2;
    }
    #instruction {
      width: 100%; max-width: 40rem; word-break: break-word;
      font-size: clamp(1rem, 5vmin, 2rem); font-weight: 700; line-height: 1.4;
      margin: 1rem 0;
    }
    #instruction:empty { margin: 0; }
    #stop-btn { margin-top: 1.5rem; }

    /* ── Intro (oefenlevel only): the quiz show host ── */
    /* Fills the screen behind the zones and the game screen; every tap falls
       through to the answer zones. The text sits at the top and the buttons at
       the bottom, so the host stays visible in between. */
    #intro-stage {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: linear-gradient(#211a6a 0%, #171553 50%, #0f1344 50%, #0f1344 100%);
    }
    #intro-stage[hidden] { display: none; }
    #intro-scene { position: absolute; inset: 0; }
    #intro-scene .quizhost-svg { display: block; width: 100%; height: 100%; }
    #intro-spacer { display: none; }
    body.intro-scene #intro-spacer { display: block; flex: 1; }
    body.intro-scene #game-screen { color: #fff; }
    body.intro-scene #instruction:not(:empty) {
      background: rgb(8 10 40 / 0.72); border-radius: 12px; padding: 0.5rem 0.9rem;
      box-sizing: border-box; text-shadow: 0 1px 2px rgb(0 0 0 / 0.6);
    }
    /* on the dark stage the answer outlines need light ink */
    body.intro-scene .zone {
      border-color: rgb(255 255 255 / 0.4); color: rgb(255 255 255 / 0.75);
      font-size: 18px; font-weight: 700;
    }
    /* the zone the host is pointing at */
    body.intro-scene .zone.zone-lit {
      border: 3px solid #ffd35a; color: #ffe9a8;
      animation: zone-pulse 0.8s ease-in-out infinite;
    }
    @keyframes zone-pulse {
      0%, 100% { background: rgb(255 211 90 / 0.08); }
      50%      { background: rgb(255 211 90 / 0.3); }
    }
    @media (prefers-reduced-motion: reduce) {
      body.intro-scene .zone.zone-lit { animation: none; background: rgb(255 211 90 / 0.2); }
    }

    /* ── Phones in landscape ── */
    /* Very little height: tighten spacing so the text fits, and let the start
       screen scroll as a last resort rather than clipping it. */
    #start-screen, #game-screen { justify-content: safe center; }
    @media (orientation: landscape) and (max-height: 500px) {
      #start-screen, #game-screen { padding: 2.25rem 1rem 0.5rem; }
      #start-screen { overflow-y: auto; touch-action: pan-y; }
      h1 { margin-bottom: 0.25rem; }
      #intro-blurb { line-height: 1.4; margin: 0.25rem 0; max-width: 48rem; }
      #instruction { margin: 0.4rem 0; }
      .home-link, #stop-btn { margin-top: 0.5rem; }
      button, .home-link { padding: 0.4rem 1rem; }
    }
  </style>
</head>
<body>
<div id="hud">
  <span id="hud-phase"></span>
  <span id="hud-progress"></span>
  <span id="hud-score"></span>
  <span id="hud-tier"></span>
  <span id="hud-results"></span>
  <select id="hud-song-picker" data-ui title="dwing een specifiek lied af (dev preview)"></select>
</div>

<!-- the oefenlevel's quiz show host (src/intro/); sits behind the zones -->
<div id="intro-stage" hidden>
  <div id="intro-scene"></div>
</div>

<div id="zone-a" class="zone">A</div>
<div id="zone-b" class="zone">B</div>
<div id="zone-c" class="zone">C</div>
<div id="zone-d" class="zone">D</div>

<div id="start-screen">
  <h1>Prototype 7 &mdash; Wat hoor je?</h1>
  <p id="intro-blurb">
    
  </p>
  <p id="start-note" hidden></p>
  <div id="menu-buttons">
    <button id="intro-btn" data-ui>Start oefenlevel</button>
    <button id="game-btn" data-ui>Start quiz</button>
  </div>
  <a id="home-link" class="home-link" href="../" data-ui>&larr; Terug naar hoofdmenu</a>
</div>

<div id="game-screen" hidden>
  <div id="instruction" aria-live="polite"></div>
  <div id="intro-spacer" aria-hidden="true"></div>

  <button id="stop-btn" data-ui>Stop &mdash; terug naar startscherm</button>
</div>

<!-- The WebAudioFont instruments (repo-root /public/fonts) are listed in
     src/fonts.ts and loaded by the shared ../src/fonts.ts, so the combined/ shell
     can hand over its already-decoded copies instead of each page loading them. -->
<script type="module" src="src/main.ts"></script>
</body>
</html>
